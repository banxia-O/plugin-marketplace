name: Step 3 Verification

on:
  push:
    branches:
      - feature/wechat-miniapp-v1
    paths:
      - 'packages/miniapp/**'
      - '.github/workflows/step3-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Miniapp typecheck
        run: pnpm --filter @ppx/miniapp typecheck

      - name: Miniapp WeChat build
        run: pnpm --filter @ppx/miniapp build

      - name: Confirm Step 3 page outputs
        run: |
          for file in \
            packages/miniapp/dist/pages/search/index.js \
            packages/miniapp/dist/pages/category/index.js \
            packages/miniapp/dist/pages/plugin/index.js; do
            test -f "$file" || { echo "Missing expected output: $file"; exit 1; }
          done

      - name: Verify production search and category contracts
        run: |
          node <<'NODE'
          const base = 'https://plugin.md-banxia.cn'

          async function get(path) {
            const response = await fetch(`${base}${path}`)
            if (!response.ok) throw new Error(`${path} failed: ${response.status}`)
            return response.json()
          }

          const categoriesBody = await get('/api/categories')
          const category = categoriesBody.categories.find(
            (item) => Array.isArray(item.subcategories) && item.subcategories.length > 0,
          )
          if (!category) throw new Error('No category with subcategories for Step 3 verification')

          const categoryList = await get(
            `/api/plugins?category=${encodeURIComponent(category.slug)}&page=1&pageSize=2`,
          )
          if (!Array.isArray(categoryList.plugins) || typeof categoryList.total !== 'number') {
            throw new Error('Category plugin list contract mismatch')
          }

          const subcategory = category.subcategories[0]
          const subcategoryList = await get(
            `/api/plugins?category=${encodeURIComponent(category.slug)}&subcategory=${encodeURIComponent(subcategory.slug)}&page=1&pageSize=2`,
          )
          if (!Array.isArray(subcategoryList.plugins) || typeof subcategoryList.total !== 'number') {
            throw new Error('Subcategory plugin list contract mismatch')
          }

          const searchList = await get('/api/plugins?q=PDF&page=1&pageSize=2')
          if (!Array.isArray(searchList.plugins) || typeof searchList.total !== 'number') {
            throw new Error('Search plugin list contract mismatch')
          }

          console.log(
            `Step 3 API OK; category=${category.slug}; subcategory=${subcategory.slug}; searchTotal=${searchList.total}`,
          )
          NODE

      - name: Confirm Step 3 boundaries and navigation
        run: |
          grep -F "/pages/plugin/index?slug=" packages/miniapp/src/components/plugin-card.tsx
          grep -F "'pages/plugin/index'" packages/miniapp/src/app.config.ts
          if grep -R -E "apiClient\.getPlugin|descriptionMd|copy|setClipboardData|agentMd" \
            packages/miniapp/src/pages/plugin/index.tsx >/dev/null 2>&1; then
            echo 'Step 4 detail implementation leaked into Step 3'
            exit 1
          fi

      - name: Existing workspace regression checks
        run: |
          pnpm -r test
          pnpm -r typecheck
          pnpm -r build
