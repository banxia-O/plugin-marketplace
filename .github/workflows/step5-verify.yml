name: Step 5 Verification

on:
  push:
    branches:
      - feature/wechat-miniapp-v1
    paths:
      - 'packages/miniapp/**'
      - '.github/workflows/step5-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Miniapp typecheck
        run: pnpm --filter @ppx/miniapp typecheck

      - name: Miniapp WeChat build
        run: pnpm --filter @ppx/miniapp build

      - name: Confirm Step 5 storage rules
        run: |
          grep -F "const MAX_RECENT_VIEWS = 20" packages/miniapp/src/storage/recent-views.ts
          grep -F "item.slug !== view.slug" packages/miniapp/src/storage/recent-views.ts
          grep -F ".slice(0, MAX_RECENT_VIEWS)" packages/miniapp/src/storage/recent-views.ts
          grep -F "Taro.getStorage" packages/miniapp/src/storage/recent-views.ts
          grep -F "Taro.setStorage" packages/miniapp/src/storage/recent-views.ts
          grep -F "Taro.removeStorage" packages/miniapp/src/storage/recent-views.ts
          grep -F "views.slice(0, 6)" packages/miniapp/src/pages/index/index.tsx
          grep -F "recordRecentView" packages/miniapp/src/pages/plugin/index.tsx
          grep -F "lastViewedAt: Date.now()" packages/miniapp/src/pages/plugin/index.tsx
          grep -F "clearRecentViews" packages/miniapp/src/pages/index/index.tsx

      - name: Confirm only allowed recent-view fields are written
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const source = fs.readFileSync('packages/miniapp/src/pages/plugin/index.tsx', 'utf8')
          const match = source.match(/recordRecentView\(\{([\s\S]*?)\}\)/)
          if (!match) throw new Error('recordRecentView payload not found')
          const payload = match[1]
          for (const field of ['slug:', 'name:', 'oneLiner:', 'lastViewedAt:']) {
            if (!payload.includes(field)) throw new Error(`Missing recent-view field: ${field}`)
          }
          for (const forbidden of ['repoUrl:', 'agentMd:', 'categories:', 'stars:', 'reviewStatus:']) {
            if (payload.includes(forbidden)) throw new Error(`Forbidden recent-view field: ${forbidden}`)
          }
          NODE

      - name: Confirm local-only Step 5 scope
        run: |
          if grep -E "apiClient|fetch\(|Taro.request" packages/miniapp/src/storage/recent-views.ts >/dev/null 2>&1; then
            echo 'Recent views must stay local and not call network APIs'
            exit 1
          fi
          if grep -R -E "requirePrivacyAuthorize|login|setUser|recent.*api" packages/miniapp/src/storage packages/miniapp/src/pages/index/index.tsx >/dev/null 2>&1; then
            echo 'Out-of-scope login/privacy/server sync leaked into Step 5'
            exit 1
          fi

      - name: Existing workspace regression checks
        run: |
          pnpm -r test
          pnpm -r typecheck
          pnpm -r build
