name: Step 6 Verification

on:
  push:
    branches:
      - feature/wechat-miniapp-v1
    paths:
      - 'packages/miniapp/**'
      - '.github/workflows/step6-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Miniapp typecheck
        run: pnpm --filter @ppx/miniapp typecheck

      - name: Miniapp WeChat build
        run: pnpm --filter @ppx/miniapp build

      - name: Confirm Step 6 content
        run: |
          ABOUT=packages/miniapp/src/pages/about/index.tsx
          grep -F '用户协议（V1）' "$ABOUT"
          grep -F '隐私说明' "$ABOUT"
          grep -F '数据来源说明' "$ABOUT"
          grep -F '科研敏感信息提醒' "$ABOUT"
          grep -F '第三方 / 开源说明' "$ABOUT"
          grep -F '版本信息' "$ABOUT"
          grep -F '不要求微信登录' "$ABOUT"
          grep -F '不上传服务器' "$ABOUT"
          grep -F '搜索关键词会发送至插件百宝阁现有 API' "$ABOUT"
          grep -F '不提供医疗诊断、临床决策或诊疗建议' "$ABOUT"
          grep -F 'MIT License' "$ABOUT"

      - name: Confirm sensitivity notice consistency
        run: |
          NOTICE='请勿输入患者身份信息、未公开研究数据或其他敏感信息。'
          grep -F "$NOTICE" packages/miniapp/src/pages/index/index.tsx
          grep -F "$NOTICE" packages/miniapp/src/pages/search/index.tsx
          grep -F "$NOTICE" packages/miniapp/src/pages/about/index.tsx

      - name: Confirm Step 6 privacy scope
        run: |
          if grep -R -E 'requirePrivacyAuthorize|openPrivacyContract|getUserProfile|getPhoneNumber|getLocation|chooseImage|chooseMedia|Taro\.login|wx\.login' packages/miniapp/src >/dev/null 2>&1; then
            echo 'Unexpected personal-information/privacy API in miniapp V1'
            exit 1
          fi

      - name: Existing workspace regression checks
        run: |
          pnpm -r test
          pnpm -r typecheck
          pnpm -r build
