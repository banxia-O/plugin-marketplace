name: Step 2 Verification

on:
  push:
    branches:
      - feature/wechat-miniapp-v1
    paths:
      - 'packages/miniapp/**'
      - '.github/workflows/step2-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Miniapp typecheck
        run: pnpm --filter @ppx/miniapp typecheck

      - name: Miniapp WeChat build
        run: pnpm --filter @ppx/miniapp build

      - name: Confirm Step 2 page outputs
        run: |
          for file in \
            packages/miniapp/dist/pages/index/index.js \
            packages/miniapp/dist/pages/search/index.js \
            packages/miniapp/dist/pages/category/index.js \
            packages/miniapp/dist/pages/categories/index.js \
            packages/miniapp/dist/pages/about/index.js; do
            test -f "$file" || { echo "Missing expected output: $file"; exit 1; }
          done

      - name: Verify production category contract and shortcut slugs
        run: |
          node <<'NODE'
          const response = await fetch('https://plugin.md-banxia.cn/api/categories')
          if (!response.ok) throw new Error(`/api/categories failed: ${response.status}`)
          const body = await response.json()
          if (!Array.isArray(body.categories) || body.categories.length === 0) {
            throw new Error('/api/categories returned no categories')
          }
          const actual = new Set(body.categories.map((category) => category.slug))
          const required = ['research', 'search', 'files', 'data', 'ai', 'dev']
          const missing = required.filter((slug) => !actual.has(slug))
          if (missing.length > 0) throw new Error(`Missing home shortcut slugs: ${missing.join(', ')}`)
          console.log(`Step 2 category contract OK; categories=${body.categories.length}`)
          NODE

      - name: Confirm Step 2 scope boundaries
        run: |
          if grep -R -E "排行榜|半夏精选|用户上传|AI 推荐|微信登录|GitHub OAuth" packages/miniapp/src/pages/index >/dev/null 2>&1; then
            echo 'Forbidden V1 home feature found'
            exit 1
          fi
          if grep -R -E "setStorage|setStorageSync|getStorage|getStorageSync" packages/miniapp/src/pages/index packages/miniapp/src/config >/dev/null 2>&1; then
            echo 'Recent browsing storage belongs to Step 5, not Step 2'
            exit 1
          fi

      - name: Existing workspace regression checks
        run: |
          pnpm -r test
          pnpm -r typecheck
          pnpm -r build
